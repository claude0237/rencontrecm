{% extends "layouts/base.html" %}

{% block title %}Mot de passe oublié - RencontresCM{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-xl p-8">
    <h1 class="text-3xl font-bold text-rose text-center mb-8">Mot de passe oublié</h1>
    
    <form x-data="{ 
        identifier: '',
        loading: false,
        error: '',
        success: '',
        requestReset() {
            this.loading = true;
            this.error = '';
            this.success = '';
            
            const payload = {};
            if (this.identifier.includes('@')) {
                payload.email = this.identifier;
            } else {
                payload.contact_direct = this.identifier;
            }
            
            fetch('/api/v1/auth/password-reset/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    this.error = data.error;
                } else {
                    this.success = data.message;
                    setTimeout(() => {
                        window.location.href = '/verify-code?identifier=' + encodeURIComponent(this.identifier);
                    }, 2000);
                }
            })
            .catch(err => {
                this.error = 'Erreur lors de la demande';
            })
            .finally(() => {
                this.loading = false;
            });
        }
    }" @submit.prevent="requestReset">
        <div class="mb-6">
            <label class="block text-charcoal font-semibold mb-2">Email ou Téléphone</label>
            <input type="text" x-model="identifier" required
                placeholder="Entrez votre email ou numéro de téléphone"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
        </div>
        
        <div x-show="error" x-text="error" class="text-rose mb-4"></div>
        <div x-show="success" x-text="success" class="text-green-600 mb-4"></div>
        
        <button type="submit" :disabled="loading"
            class="w-full bg-rose text-white py-3 rounded-lg font-semibold hover:bg-rose-dark transition disabled:opacity-50">
            <span x-show="!loading">Envoyer le code</span>
            <span x-show="loading">Envoi...</span>
        </button>
    </form>
    
    <p class="text-center mt-6 text-charcoal">
        <a href="/login" class="text-rose font-semibold hover:underline">Retour à la connexion</a>
    </p>
</div>
{% endblock %}
