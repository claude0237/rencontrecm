{% extends "layouts/base.html" %}

{% block title %}Réinitialiser le mot de passe - RencontresCM{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-xl p-8">
    <h1 class="text-3xl font-bold text-rose text-center mb-8">Nouveau mot de passe</h1>
    
    <form x-data="{ 
        email: new URLSearchParams(window.location.search).get('email') || '',
        code: new URLSearchParams(window.location.search).get('code') || '',
        newPassword: '',
        confirmPassword: '',
        loading: false,
        error: '',
        success: '',
        resetPassword() {
            this.loading = true;
            this.error = '';
            this.success = '';
            
            if (this.newPassword !== this.confirmPassword) {
                this.error = 'Les mots de passe ne correspondent pas';
                this.loading = false;
                return;
            }
            
            if (this.newPassword.length < 6) {
                this.error = 'Le mot de passe doit contenir au moins 6 caractères';
                this.loading = false;
                return;
            }
            
            const payload = {
                email: this.email,
                code: this.code,
                new_password: this.newPassword
            };
            
            fetch('/api/v1/auth/password-reset/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    this.error = data.error;
                } else {
                    this.success = data.message;
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                }
            })
            .catch(err => {
                this.error = 'Erreur lors de la réinitialisation';
            })
            .finally(() => {
                this.loading = false;
            });
        }
    }" @submit.prevent="resetPassword">
        <div class="mb-4">
            <label class="block text-charcoal font-semibold mb-2">Nouveau mot de passe</label>
            <input type="password" x-model="newPassword" required minlength="6"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
        </div>
        
        <div class="mb-6">
            <label class="block text-charcoal font-semibold mb-2">Confirmer le mot de passe</label>
            <input type="password" x-model="confirmPassword" required minlength="6"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
        </div>
        
        <div x-show="error" x-text="error" class="text-rose mb-4"></div>
        <div x-show="success" x-text="success" class="text-green-600 mb-4"></div>
        
        <button type="submit" :disabled="loading"
            class="w-full bg-rose text-white py-3 rounded-lg font-semibold hover:bg-rose-dark transition disabled:opacity-50">
            <span x-show="!loading">Réinitialiser</span>
            <span x-show="loading">Réinitialisation...</span>
        </button>
    </form>
    
    <p class="text-center mt-6 text-charcoal">
        <a href="/login" class="text-rose font-semibold hover:underline">Retour à la connexion</a>
    </p>
</div>
{% endblock %}
