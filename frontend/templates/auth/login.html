{% extends "layouts/base.html" %}

{% block title %}Connexion - RencontresCM{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-xl p-8">
    <h1 class="text-3xl font-bold text-rose text-center mb-8">Connexion</h1>
    
    <form x-data="{ 
        email: '', 
        password: '',
        latitude: null,
        longitude: null,
        equipement: '',
        loading: false,
        error: '',
        init() {
            this.getGeolocation();
            this.getEquipment();
        },
        getGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        this.latitude = position.coords.latitude;
                        this.longitude = position.coords.longitude;
                    },
                    (error) => {
                        console.log('Erreur de géolocalisation:', error);
                    }
                );
            }
        },
        getEquipment() {
            const ua = navigator.userAgent;
            let browser = 'Unknown';
            let os = 'Unknown';
            
            if (ua.indexOf('Firefox') > -1) browser = 'Firefox';
            else if (ua.indexOf('Chrome') > -1) browser = 'Chrome';
            else if (ua.indexOf('Safari') > -1) browser = 'Safari';
            else if (ua.indexOf('Edge') > -1) browser = 'Edge';
            else if (ua.indexOf('Opera') > -1) browser = 'Opera';
            
            if (ua.indexOf('Win') > -1) os = 'Windows';
            else if (ua.indexOf('Mac') > -1) os = 'MacOS';
            else if (ua.indexOf('Linux') > -1) os = 'Linux';
            else if (ua.indexOf('Android') > -1) os = 'Android';
            else if (ua.indexOf('iOS') > -1) os = 'iOS';
            
            this.equipement = `${os} - ${browser}`;
        }
    }" @submit.prevent="login" x-init="init()">
        <div class="mb-4">
            <label class="block text-charcoal font-semibold mb-2">Email</label>
            <input type="email" x-model="email" required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
        </div>
        
        <div class="mb-6">
            <label class="block text-charcoal font-semibold mb-2">Mot de passe</label>
            <input type="password" x-model="password" required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
        </div>
        
        <div class="mb-4 text-right">
            <a href="/forgot-password" class="text-rose text-sm hover:underline">Mot de passe oublié?</a>
        </div>
        
        <div x-show="error" x-text="error" class="text-rose mb-4"></div>
        
        <button type="submit" :disabled="loading"
            class="w-full bg-rose text-white py-3 rounded-lg font-semibold hover:bg-rose-dark transition disabled:opacity-50">
            <span x-show="!loading">Se connecter</span>
            <span x-show="loading">Connexion...</span>
        </button>
    </form>
    
    <p class="text-center mt-6 text-charcoal">
        Pas encore de compte? 
        <a href="/register" class="text-rose font-semibold hover:underline">Créer un compte</a>
    </p>
</div>

{% block extra_scripts %}
<script>
function login(event) {
    this.loading = true;
    this.error = '';
    
    const payload = {
        email: this.email,
        password: this.password,
        equipement: this.equipement
    };
    
    if (this.latitude !== null && this.longitude !== null) {
        payload.latitude = this.latitude;
        payload.longitude = this.longitude;
    }
    
    fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            this.error = data.error;
        } else {
            window.location.href = '/';
        }
    })
    .catch(err => {
        this.error = 'Erreur de connexion';
    })
    .finally(() => {
        this.loading = false;
    });
}
</script>
{% endblock %}
{% endblock %}
