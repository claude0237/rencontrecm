{% extends "layouts/base.html" %}

{% block title %}Profil - RencontresCM{% endblock %}

{% block content %}
<div x-data="{ 
    profil: null,
    currentUser: null,
    editing: false,
    loading: true,
    saving: false,
    uploading: false,
    regions: [],
    quartiers: [],
    newPhotos: [],
    similarProfiles: [],
    similarPagination: {
        currentPage: 1,
        totalPages: 1,
        total: 0,
        limit: 6
    },
    userLocation: { lat: null, lon: null },
    lightboxOpen: false,
    currentPhotoIndex: 0,
    formData: {
        nom: '',
        age: '',
        genre: '',
        description: '',
        photos: [],
        photo_principale: 0,
        contact_whatsapp: '',
        contact_direct: '',
        email: '',
        password: '',
        region_id: '',
        quartier_id: ''
    },
    init() {
        this.loadCurrentUser();
        this.loadRegions();
        this.getUserLocation();
    },
    isOwnProfile() {
        return this.currentUser && this.profil && this.currentUser.id === this.profil.id;
    },
    isNotOwnProfile() {
        return !this.currentUser || !this.profil || this.currentUser.id !== this.profil.id;
    },
    hasActiveSubscription() {
        return this.profil && this.profil.subscription && this.profil.subscription.pack;
    },
    loadProfil() {
        const pathParts = window.location.pathname.split('/');
        const userId = pathParts[pathParts.length - 1];
        
        if (isNaN(userId) || userId === 'profil') {
            this.loadCurrentUserProfil();
        } else {
            const params = new URLSearchParams();
            if (this.userLocation.lat) params.append('lat', this.userLocation.lat);
            if (this.userLocation.lon) params.append('lon', this.userLocation.lon);
            
            fetch(`/api/v1/profil/${userId}?${params}`)
                .then(r => r.json())
                .then(data => {
                    this.profil = data.profil;
                    this.loading = false;
                    this.loadSimilarProfiles();
                    // Increment visit count when viewing another user's profile
                    if (this.currentUser && this.currentUser.id !== this.profil.id) {
                        fetch(`/api/v1/profil/${userId}/visite`, { method: 'POST' })
                            .then(r => r.json())
                            .then(data => {
                                this.profil.nombre_visites = data.nombre_visites;
                            })
                            .catch(err => console.error('Error incrementing visit count:', err));
                    }
                })
                .catch(err => {
                    console.error('Error loading profil:', err);
                    this.loading = false;
                });
        }
    },
    loadCurrentUserProfil() {
        fetch('/api/v1/auth/me')
            .then(r => r.json())
            .then(data => {
                if (data.user) {
                    this.profil = data.user;
                    this.currentUser = data.user;
                    // Load subscription info
                    this.loadSubscription();
                }
                this.loading = false;
            })
            .catch(err => {
                console.error('Error loading current user profil:', err);
                this.loading = false;
            });
    },
    loadSubscription() {
        fetch('/api/v1/my-subscription')
            .then(r => r.json())
            .then(data => {
                if (data.subscription) {
                    this.profil.subscription = data.subscription;
                }
            })
            .catch(err => {
                console.error('Error loading subscription:', err);
            });
    },
    loadCurrentUser() {
        fetch('/api/v1/auth/me')
            .then(r => r.json())
            .then(data => {
                if (data.user) {
                    this.currentUser = data.user;
                } else {
                    this.currentUser = null;
                }
            })
            .catch(err => {
                console.error('Error loading current user:', err);
                this.currentUser = null;
            });
    },
    loadRegions() {
        fetch('/api/v1/regions')
            .then(r => r.json())
            .then(data => {
                this.regions = data.regions;
            })
            .catch(err => console.error('Error loading regions:', err));
    },
    loadQuartiers(regionId) {
        fetch(`/api/v1/quartiers/${regionId}`)
            .then(r => r.json())
            .then(data => {
                this.quartiers = data.quartiers;
            })
            .catch(err => console.error('Error loading quartiers:', err));
    },
    getUserLocation() {
        // Load profile immediately without waiting for GPS
        this.loadProfil();
        
        // Then try to get location for distance calculation
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const newLat = position.coords.latitude;
                    const newLon = position.coords.longitude;
                    
                    // Only reload if location actually changed
                    if (this.userLocation.lat !== newLat || this.userLocation.lon !== newLon) {
                        this.userLocation.lat = newLat;
                        this.userLocation.lon = newLon;
                        // Reload profile with correct distance
                        this.loadProfil();
                    }
                },
                (error) => {
                    console.log('Erreur de géolocalisation:', error);
                    // Profile already loaded without distance
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }
    },
    loadSimilarProfiles() {
        if (!this.profil) return;
        
        const params = new URLSearchParams();
        if (this.userLocation.lat) params.append('lat', this.userLocation.lat);
        if (this.userLocation.lon) params.append('lon', this.userLocation.lon);
        if (this.profil.genre) params.append('genre', this.profil.genre);
        params.append('page', this.similarPagination.currentPage);
        params.append('limit', this.similarPagination.limit);
        
        fetch(`/api/v1/profils/recommandes?${params}`)
            .then(r => r.json())
            .then(data => {
                // Filter out the current profile from recommendations
                this.similarProfiles = data.profils.filter(p => p.id !== this.profil.id);
                this.similarPagination.total = data.total;
                this.similarPagination.totalPages = data.total_pages;
                this.similarPagination.currentPage = data.page;
            })
            .catch(err => console.error('Error loading similar profiles:', err));
    },
    prevSimilarPage() {
        if (this.similarPagination.currentPage > 1) {
            this.similarPagination.currentPage--;
            this.loadSimilarProfiles();
        }
    },
    nextSimilarPage() {
        if (this.similarPagination.currentPage < this.similarPagination.totalPages) {
            this.similarPagination.currentPage++;
            this.loadSimilarProfiles();
        }
    },
    goToSimilarPage(page) {
        this.similarPagination.currentPage = page;
        this.loadSimilarProfiles();
    },
    uploadPhotos(event) {
        const files = event.target.files;
        if (!files.length) return;
        
        this.uploading = true;
        const uploadPromises = [];
        
        for (let i = 0; i < files.length; i++) {
            const formData = new FormData();
            formData.append('photo', files[i]);
            
            uploadPromises.push(
                fetch('/api/v1/upload-photo', {
                    method: 'POST',
                    body: formData
                })
                .then(r => r.json())
                .then(data => {
                    if (data.photo_url) {
                        this.newPhotos.push(data.photo_url);
                    }
                })
            );
        }
        
        Promise.all(uploadPromises)
            .then(() => {
                this.uploading = false;
                this.formData.photos = [...(this.profil.photos || []), ...this.newPhotos];
                event.target.value = '';
            })
            .catch(err => {
                console.error('Error uploading photos:', err);
                alert('Erreur lors de l\'upload des photos');
                this.uploading = false;
            });
    },
    removePhoto(index) {
        this.formData.photos.splice(index, 1);
    },
    startEdit() {
        this.editing = true;
        this.newPhotos = [];
        this.formData = {
            nom: this.profil.nom,
            age: this.profil.age,
            genre: this.profil.genre,
            description: this.profil.description || '',
            photos: this.profil.photos || [],
            photo_principale: this.profil.photo_principale || 0,
            contact_whatsapp: this.profil.contact_whatsapp || '',
            contact_direct: this.profil.contact_direct || '',
            email: this.profil.email,
            password: '',
            region_id: this.profil.region_id,
            quartier_id: this.profil.quartier_id
        };
        if (this.profil.region_id) {
            this.loadQuartiers(this.profil.region_id);
        }
    },
    cancelEdit() {
        this.editing = false;
        this.newPhotos = [];
        this.formData = {
            nom: '',
            age: '',
            genre: '',
            description: '',
            photos: [],
            contact_whatsapp: '',
            contact_direct: '',
            email: '',
            password: '',
            region_id: '',
            quartier_id: ''
        };
    },
    saveProfil() {
        this.saving = true;
        const data = {};
        if (this.formData.nom) data.nom = this.formData.nom;
        if (this.formData.age) data.age = parseInt(this.formData.age);
        if (this.formData.genre) data.genre = this.formData.genre;
        if (this.formData.description) data.description = this.formData.description;
        if (this.formData.photos && this.formData.photos.length > 0) {
            data.photos = this.formData.photos;
            console.log('Saving photos:', this.formData.photos);
        }
        if (this.formData.photo_principale !== undefined) data.photo_principale = this.formData.photo_principale;
        if (this.formData.contact_whatsapp) data.contact_whatsapp = this.formData.contact_whatsapp;
        if (this.formData.contact_direct) data.contact_direct = this.formData.contact_direct;
        if (this.formData.email) data.email = this.formData.email;
        if (this.formData.password) data.password = this.formData.password;
        if (this.formData.region_id) data.region_id = parseInt(this.formData.region_id);
        if (this.formData.quartier_id) data.quartier_id = parseInt(this.formData.quartier_id);
        
        console.log('Saving profile data:', data);
        
        fetch('/api/v1/profil', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
            } else {
                this.profil = data.user;
                this.currentUser = data.user;
                this.editing = false;
                this.newPhotos = [];
                console.log('Profile updated successfully:', data.user);
                alert('Profil mis à jour avec succès');
            }
            this.saving = false;
        })
        .catch(err => {
            console.error('Error saving profil:', err);
            alert('Erreur lors de la mise à jour du profil');
            this.saving = false;
        });
    },
    appeler() {
        fetch(`/api/v1/profil/${this.profil.id}/appeler`, {
            method: 'POST'
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
            } else {
                // Open phone dialer
                window.location.href = `tel:${data.appele_phone}`;
            }
        })
        .catch(err => {
            console.error('Error calling:', err);
            alert('Erreur lors de l\'appel');
        });
    },
    envoyerWhatsApp() {
        fetch(`/api/v1/profil/${this.profil.id}/whatsapp`, {
            method: 'POST'
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
            } else {
                // Open WhatsApp
                window.open(data.whatsapp_url, '_blank');
            }
        })
        .catch(err => {
            console.error('Error sending WhatsApp:', err);
            alert('Erreur lors de l\'envoi WhatsApp');
        });
    },
    openLightbox(index) {
        this.currentPhotoIndex = index;
        this.lightboxOpen = true;
        document.body.style.overflow = 'hidden';
    },
    closeLightbox() {
        this.lightboxOpen = false;
        document.body.style.overflow = 'auto';
    },
    nextPhoto() {
        if (this.profil.photos && this.profil.photos.length > 0) {
            this.currentPhotoIndex = (this.currentPhotoIndex + 1) % this.profil.photos.length;
        }
    },
    prevPhoto() {
        if (this.profil.photos && this.profil.photos.length > 0) {
            this.currentPhotoIndex = (this.currentPhotoIndex - 1 + this.profil.photos.length) % this.profil.photos.length;
        }
    }
}" x-init="init()">
    <div x-show="loading" class="text-center py-12">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-rose border-t-transparent"></div>
        <p class="mt-4 text-charcoal">Chargement...</p>
    </div>
    
    <div x-show="!loading && profil" class="max-w-4xl mx-auto px-4">
        <div class="bg-white rounded-lg shadow-xl overflow-hidden">
            <div class="p-4 md:p-8">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h1 class="text-2xl md:text-4xl font-bold text-charcoal mb-2" x-text="profil.nom"></h1>
                        <p class="text-rose text-lg md:text-2xl font-semibold" x-text="profil.age + ' ans'"></p>
                        <template x-if="profil.subscription && profil.subscription.pack && profil.subscription.pack.badge">
                            <span class="inline-block mt-2 px-3 py-1 rounded-full text-sm font-semibold"
                                :class="{
                                    'bg-gray-200 text-gray-800': profil.subscription.pack.niveau === 'gratuit',
                                    'bg-orange-200 text-orange-800': profil.subscription.pack.niveau === 'bronze',
                                    'bg-gray-300 text-gray-800': profil.subscription.pack.niveau === 'silver',
                                    'bg-yellow-200 text-yellow-800': profil.subscription.pack.niveau === 'gold',
                                    'bg-purple-200 text-purple-800': profil.subscription.pack.niveau === 'vip'
                                }" x-text="profil.subscription.pack.badge">
                            </span>
                        </template>
                    </div>
                    <template x-if="isOwnProfile()">
                        <button @click="startEdit()" x-show="!editing" class="bg-rose text-white px-4 py-2 rounded-lg hover:bg-rose-dark transition text-sm md:text-base">Modifier</button>
                    </template>
                </div>
                
                <div x-show="!editing">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 mb-6">
                        <div class="bg-cream p-4 rounded-lg">
                            <h3 class="font-bold text-charcoal mb-2 text-sm md:text-base">Localisation</h3>
                            <p class="text-gray-600 text-sm md:text-base" x-text="profil.region_nom + ', ' + profil.quartier_nom"></p>
                        </div>
                        
                        <div class="bg-cream p-4 rounded-lg">
                            <h3 class="font-bold text-charcoal mb-2 text-sm md:text-base">Genre</h3>
                            <p class="text-gray-600 text-sm md:text-base" x-text="profil.genre === 'homme' ? 'Homme' : 'Femme'"></p>
                        </div>
                        
                        <div class="bg-cream p-4 rounded-lg">
                            <h3 class="font-bold text-charcoal mb-2 text-sm md:text-base">Visites</h3>
                            <p class="text-gray-600 text-sm md:text-base" x-text="(profil.nombre_visites || 0) + ' fois'"></p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 mb-6">
                        <template x-if="profil.distance !== null && isNotOwnProfile()">
                            <div class="bg-green-50 p-4 rounded-lg">
                                <h3 class="font-bold text-charcoal mb-2 text-sm md:text-base">Distance</h3>
                                <p class="text-green-600 text-sm md:text-base font-semibold" x-text="profil.distance + ' km'"></p>
                            </div>
                        </template>
                    </div>
                    
                    <div class="mb-6">
                        <h3 class="font-bold text-charcoal mb-2 text-sm md:text-base">À propos</h3>
                        <p class="text-gray-600 text-sm md:text-base" x-text="profil.description || 'Aucune description'"></p>
                    </div>
                    
                    <!-- Subscription Limitations (only for own profile) -->
                    <template x-if="isOwnProfile() && hasActiveSubscription()">
                        <div class="mb-6 bg-rose-50 p-4 rounded-lg border border-rose-200">
                            <h3 class="font-bold text-charcoal mb-3 text-sm md:text-base">📊 Mon Abonnement: <span x-text="profil.subscription.pack.nom"></span></h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-sm">
                                <div>
                                    <p class="text-gray-600">Profils consultables/jour:</p>
                                    <p class="font-semibold" x-text="profil.subscription.pack.profils_consultables_par_jour === -1 ? 'Illimité' : profil.subscription.pack.profils_consultables_par_jour"></p>
                                    <p class="text-gray-500 text-xs" x-text="'Utilisés: ' + profil.subscription.profils_consultes_aujourdhui"></p>
                                </div>
                                <div>
                                    <p class="text-gray-600">Contacts WhatsApp/jour:</p>
                                    <p class="font-semibold" x-text="profil.subscription.pack.contacts_whatsapp_par_jour === -1 ? 'Illimité' : profil.subscription.pack.contacts_whatsapp_par_jour"></p>
                                    <p class="text-gray-500 text-xs" x-text="'Utilisés: ' + profil.subscription.contacts_whatsapp_aujourdhui"></p>
                                </div>
                                <div>
                                    <p class="text-gray-600">Appels directs/jour:</p>
                                    <p class="font-semibold" x-text="profil.subscription.pack.appels_directs_par_jour === -1 ? 'Illimité' : profil.subscription.pack.appels_directs_par_jour"></p>
                                    <p class="text-gray-500 text-xs" x-text="'Utilisés: ' + profil.subscription.appels_directs_aujourdhui"></p>
                                </div>
                            </div>
                            <div class="mt-3 pt-3 border-t border-rose-200">
                                <p class="text-gray-600 text-sm">Date de fin: <span class="font-semibold" x-text="new Date(profil.subscription.date_fin).toLocaleDateString('fr-FR')"></span></p>
                                <a href="/abonnements" class="inline-block mt-2 bg-rose text-white px-4 py-2 rounded-lg hover:bg-rose-dark transition text-sm">📈 Voir les packs disponibles</a>
                            </div>
                        </div>
                    </template>
                    
                    <template x-if="profil.photos && profil.photos.length > 0">
                        <div class="mb-6">
                            <h3 class="font-bold text-charcoal mb-2 text-sm md:text-base">Photos</h3>
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                                <template x-for="(photo, index) in profil.photos" :key="index">
                                    <img :src="photo" :alt="'Photo ' + (index + 1)" @click="openLightbox(index)" class="w-full h-32 md:h-48 object-cover rounded-lg cursor-pointer hover:opacity-80 transition">
                                </template>
                            </div>
                        </div>
                    </template>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 mb-6">
                        <template x-if="profil.contact_whatsapp">
                            <div class="bg-green-50 p-4 rounded-lg flex items-center justify-between">
                                <div class="flex items-center">
                                    <span class="text-xl md:text-2xl mr-3">📱</span>
                                    <div>
                                        <h3 class="font-bold text-charcoal mb-1 text-sm md:text-base">WhatsApp</h3>
                                        <p class="text-gray-600 text-sm md:text-base" x-text="profil.contact_whatsapp"></p>
                                    </div>
                                </div>
                                <template x-if="profil.whatsapp_enabled && isNotOwnProfile()">
                                    <button @click="envoyerWhatsApp()" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition text-sm md:text-base">💬 WhatsApp</button>
                                </template>
                            </div>
                        </template>
                        
                        <template x-if="profil.contact_direct">
                            <div class="bg-blue-50 p-4 rounded-lg flex items-center justify-between">
                                <div class="flex items-center">
                                    <span class="text-xl md:text-2xl mr-3">📞</span>
                                    <div>
                                        <h3 class="font-bold text-charcoal mb-1 text-sm md:text-base">Contact direct</h3>
                                        <p class="text-gray-600 text-sm md:text-base" x-text="profil.contact_direct"></p>
                                    </div>
                                </div>
                                <template x-if="isNotOwnProfile()">
                                    <button @click="appeler()" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition text-sm md:text-base">📞 Appeler</button>
                                </template>
                            </div>
                        </template>
                    </div>
                    
                    <div class="flex flex-col sm:flex-row gap-4">
                        <a href="/" class="bg-charcoal text-white px-6 py-3 rounded-lg hover:bg-charcoal-light transition text-center">Retour à l'accueil</a>
                    </div>
                </div>
                
                <div x-show="editing" class="space-y-4">
                    <h2 class="text-xl md:text-2xl font-bold text-charcoal mb-4">Modifier mon profil</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-charcoal mb-1">Email</label>
                            <input type="email" x-model="formData.email" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-charcoal mb-1">Nouveau mot de passe (optionnel)</label>
                            <input type="password" x-model="formData.password" placeholder="Laisser vide pour ne pas changer" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-charcoal mb-1">Nom</label>
                            <input type="text" x-model="formData.nom" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-charcoal mb-1">Âge</label>
                            <input type="number" x-model="formData.age" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-charcoal mb-1">Genre</label>
                            <select x-model="formData.genre" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                                <option value="homme">Homme</option>
                                <option value="femme">Femme</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-charcoal mb-1">Région</label>
                            <select x-model="formData.region_id" @change="loadQuartiers($event.target.value)" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                                <option value="">Sélectionner une région</option>
                                <template x-for="region in regions" :key="region.id">
                                    <option :value="region.id" x-text="region.nom"></option>
                                </template>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-charcoal mb-1">Quartier</label>
                            <select x-model="formData.quartier_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                                <option value="">Sélectionner un quartier</option>
                                <template x-for="quartier in quartiers" :key="quartier.id">
                                    <option :value="quartier.id" x-text="quartier.nom"></option>
                                </template>
                            </select>
                        </div>
                        
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-charcoal mb-1">Description</label>
                            <textarea x-model="formData.description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose"></textarea>
                        </div>
                        
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-charcoal mb-1">Photos</label>
                            
                            <!-- Hidden file inputs -->
                            <input type="file" id="cameraInput" accept="image/*" capture="environment" multiple @change="uploadPhotos($event)" :disabled="uploading" class="hidden">
                            <input type="file" id="galleryInput" accept="image/*" multiple @change="uploadPhotos($event)" :disabled="uploading" class="hidden">
                            
                            <!-- Selection buttons -->
                            <div class="flex gap-4 mb-2">
                                <button @click="document.getElementById('cameraInput').click()" :disabled="uploading" class="flex-1 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition flex items-center justify-center gap-2 disabled:opacity-50">
                                    <span class="text-lg">📷</span>
                                    <span>Caméra</span>
                                </button>
                                <button @click="document.getElementById('galleryInput').click()" :disabled="uploading" class="flex-1 bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition flex items-center justify-center gap-2 disabled:opacity-50">
                                    <span class="text-lg">🖼️</span>
                                    <span>Galerie</span>
                                </button>
                            </div>
                            <p x-show="uploading" class="text-sm text-gray-500 mt-1">Upload en cours...</p>
                        </div>
                        
                        <template x-if="formData.photos && formData.photos.length > 0">
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-charcoal mb-2">Photos uploadées</label>
                                <div class="grid grid-cols-3 md:grid-cols-4 gap-2">
                                    <template x-for="(photo, index) in formData.photos" :key="index">
                                        <div class="relative">
                                            <img :src="photo" :alt="'Photo ' + (index + 1)" class="w-full h-20 md:h-24 object-cover rounded-lg cursor-pointer border-2" :class="formData.photo_principale === index ? 'border-rose' : 'border-transparent'" @click="formData.photo_principale = index">
                                            <button @click="removePhoto(index)" type="button" class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs hover:bg-red-600 transition">×</button>
                                            <template x-if="formData.photo_principale === index">
                                                <div class="absolute bottom-1 left-1 bg-rose text-white text-xs px-2 py-1 rounded">Principale</div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                                <p class="text-sm text-gray-500 mt-2">Cliquez sur une photo pour la définir comme photo de profil</p>
                            </div>
                        </template>
                        
                        <div>
                            <label class="block text-sm font-medium text-charcoal mb-1">WhatsApp</label>
                            <input type="text" x-model="formData.contact_whatsapp" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                        </div>
                        
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-charcoal mb-1">Contact direct</label>
                            <input type="text" x-model="formData.contact_direct" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                        </div>
                    </div>
                    
                    <div class="flex flex-col sm:flex-row gap-4 mt-6">
                        <button @click="saveProfil()" :disabled="saving" class="bg-rose text-white px-6 py-3 rounded-lg hover:bg-rose-dark transition disabled:opacity-50">
                            <span x-show="!saving">Enregistrer</span>
                            <span x-show="saving">Enregistrement...</span>
                        </button>
                        <button @click="cancelEdit()" class="bg-gray-500 text-white px-6 py-3 rounded-lg hover:bg-gray-600 transition">Annuler</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Similar Profiles Section -->
    <div x-show="!loading && profil && similarProfiles.length > 0" class="mt-12 max-w-6xl mx-auto px-4">
        <h2 class="text-2xl font-bold text-charcoal mb-6">Profils similaires</h2>
        <div class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="profil in similarProfiles" :key="profil.id">
                <a :href="'/profil/' + profil.id" class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition block">
                    <div class="h-48 bg-gradient-to-br from-rose to-rose-light flex items-center justify-center">
                        <template x-if="profil.photos && profil.photos.length > 0">
                            <img :src="profil.photos[0]" :alt="profil.nom" class="w-full h-full object-cover">
                        </template>
                        <template x-if="!profil.photos || profil.photos.length === 0">
                            <template x-if="profil.photo_url">
                                <img :src="profil.photo_url" :alt="profil.nom" class="w-full h-full object-cover">
                            </template>
                            <template x-if="!profil.photo_url">
                                <div class="text-white text-6xl font-bold" x-text="profil.nom.charAt(0)"></div>
                            </template>
                        </template>
                    </div>
                    <div class="p-4">
                        <h3 class="text-lg font-bold text-charcoal" x-text="profil.nom"></h3>
                        <p class="text-rose font-semibold" x-text="profil.age + ' ans'"></p>
                        <p class="text-gray-600 text-sm" x-text="profil.region_nom + ', ' + profil.quartier_nom"></p>
                        <template x-if="profil.distance !== null">
                            <p class="text-green-600 text-sm font-semibold mt-1" x-text="profil.distance + ' km'"></p>
                        </template>
                    </div>
                </a>
            </template>
        </div>
        
        <!-- Pagination Controls -->
        <div x-show="similarPagination.totalPages > 1" class="flex justify-center items-center gap-2 mt-6">
            <button @click="prevSimilarPage()" :disabled="similarPagination.currentPage === 1" 
                class="px-4 py-2 bg-rose text-white rounded-lg hover:bg-rose-dark transition disabled:opacity-50 disabled:cursor-not-allowed">
                Précédent
            </button>
            <template x-for="page in Math.min(similarPagination.totalPages, 5)" :key="page">
                <button @click="goToSimilarPage(page)" 
                    :class="similarPagination.currentPage === page ? 'bg-rose text-white' : 'bg-white text-charcoal hover:bg-gray-100'"
                    class="px-4 py-2 rounded-lg transition"
                    x-text="page">
                </button>
            </template>
            <template x-if="similarPagination.totalPages > 5">
                <span class="px-2">...</span>
            </template>
            <template x-if="similarPagination.totalPages > 5">
                <button @click="goToSimilarPage(similarPagination.totalPages)" 
                    :class="similarPagination.currentPage === similarPagination.totalPages ? 'bg-rose text-white' : 'bg-white text-charcoal hover:bg-gray-100'"
                    class="px-4 py-2 rounded-lg transition"
                    x-text="similarPagination.totalPages">
                </button>
            </template>
            <button @click="nextSimilarPage()" :disabled="similarPagination.currentPage === similarPagination.totalPages" 
                class="px-4 py-2 bg-rose text-white rounded-lg hover:bg-rose-dark transition disabled:opacity-50 disabled:cursor-not-allowed">
                Suivant
            </button>
        </div>
    </div>
    
    <!-- Lightbox Modal -->
    <div x-show="lightboxOpen" x-transition.opacity.duration.300ms 
         class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-90"
         @click.self="closeLightbox()" @keydown.escape.window="closeLightbox()">
        
        <!-- Close button -->
        <button @click="closeLightbox()" class="absolute top-4 right-4 text-white text-4xl hover:text-gray-300 transition z-10">
            &times;
        </button>
        
        <!-- Previous button -->
        <button @click.stop="prevPhoto()" class="absolute left-4 text-white text-5xl hover:text-gray-300 transition z-10">
            &#10094;
        </button>
        
        <!-- Image -->
        <div class="max-w-5xl max-h-screen p-4">
            <template x-if="profil.photos && profil.photos.length > 0">
                <img :src="profil.photos[currentPhotoIndex]" 
                     :alt="'Photo ' + (currentPhotoIndex + 1)" 
                     class="max-w-full max-h-screen object-contain rounded-lg">
            </template>
        </div>
        
        <!-- Next button -->
        <button @click.stop="nextPhoto()" class="absolute right-4 text-white text-5xl hover:text-gray-300 transition z-10">
            &#10095;
        </button>
        
        <!-- Photo counter -->
        <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 text-white text-lg bg-black bg-opacity-50 px-4 py-2 rounded-full">
            <span x-text="(currentPhotoIndex + 1) + ' / ' + (profil.photos ? profil.photos.length : 0)"></span>
        </div>
    </div>
    
    <div x-show="!loading && !profil" class="text-center py-12">
        <p class="text-xl text-charcoal">Profil non trouvé</p>
        <a href="/" class="inline-block mt-4 bg-rose text-white px-6 py-3 rounded-lg hover:bg-rose-dark transition">Retour à l'accueil</a>
    </div>
</div>
{% endblock %}
