{% extends 'layouts/base.html' %}

{% block title %}Détails Publicité - RencontreCm{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col">
    <div class="flex-1 max-w-4xl mx-auto px-4 py-4">
        <div class="bg-white rounded-lg shadow-lg p-6" x-data="{ 
        advertisement: null,
        loading: true,
        lightboxOpen: false,
        currentPhotoIndex: 0,
        init() {
            this.loadAdvertisement();
        },
        loadAdvertisement() {
            const adId = window.location.pathname.split('/').pop();
            fetch(`/api/v1/ads/pub/${adId}`)
                .then(r => r.json())
                .then(data => {
                    this.advertisement = data.advertisement;
                    this.loading = false;
                })
                .catch(err => {
                    console.error('Error loading advertisement:', err);
                    this.loading = false;
                });
        },
        openLightbox(index) {
            this.currentPhotoIndex = index;
            this.lightboxOpen = true;
            document.body.style.overflow = 'hidden';
        },
        closeLightbox() {
            this.lightboxOpen = false;
            document.body.style.overflow = 'auto';
        },
        nextPhoto() {
            if (this.advertisement.photos && this.advertisement.photos.length > 0) {
                this.currentPhotoIndex = (this.currentPhotoIndex + 1) % this.advertisement.photos.length;
            }
        },
        prevPhoto() {
            if (this.advertisement.photos && this.advertisement.photos.length > 0) {
                this.currentPhotoIndex = (this.currentPhotoIndex - 1 + this.advertisement.photos.length) % this.advertisement.photos.length;
            }
        }
    }" x-init="init()">
        <div x-show="loading" class="text-center py-8 text-gray-500">
            Chargement...
        </div>
        
        <div x-show="!loading && advertisement">
            <a href="/" class="inline-block mb-4 text-rose hover:underline">← Retour à l'accueil</a>
            
            <!-- Main Photo -->
            <template x-if="advertisement.photos && advertisement.photos.length > 0">
                <div class="mb-6">
                    <img :src="advertisement.photos[advertisement.photo_principale || 0]" :alt="advertisement.titre" 
                         class="w-full h-64 object-cover rounded-lg cursor-pointer hover:opacity-90"
                         @click="openLightbox(advertisement.photo_principale || 0)">
                </div>
                
                <!-- Photo Gallery -->
                <template x-if="advertisement.photos.length > 1">
                    <div class="mb-6">
                        <h3 class="text-lg font-bold text-charcoal mb-3">Galerie de photos</h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <template x-for="(photo, index) in advertisement.photos" :key="index">
                                <img :src="photo" :alt="'Photo ' + (index + 1)"
                                     :class="advertisement.photo_principale === index ? 'ring-4 ring-rose' : ''"
                                     class="w-full h-32 object-cover rounded-lg cursor-pointer hover:opacity-80"
                                     @click="openLightbox(index)">
                            </template>
                        </div>
                    </div>
                </template>
            </template>
            
            <!-- Fallback for single image_url (backward compatibility) -->
            <template x-if="(!advertisement.photos || advertisement.photos.length === 0) && advertisement.image_url">
                <div class="mb-6">
                    <img :src="advertisement.image_url" :alt="advertisement.titre" class="w-full h-64 object-cover rounded-lg">
                </div>
            </template>
            
            <h1 class="text-3xl font-bold text-charcoal mb-4" x-text="advertisement.titre"></h1>
            
            <p class="text-gray-600 mb-6" x-text="advertisement.description"></p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div x-show="advertisement.numero_contact" class="bg-gray-50 p-4 rounded-lg">
                    <p class="text-sm text-gray-500 mb-1">Téléphone</p>
                    <p class="text-lg font-semibold text-charcoal mb-2" x-text="advertisement.numero_contact"></p>
                    <a :href="'tel:' + advertisement.numero_contact" class="inline-block bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition text-sm">
                        📞 Appeler
                    </a>
                </div>
                <div x-show="advertisement.whatsapp" class="bg-gray-50 p-4 rounded-lg">
                    <p class="text-sm text-gray-500 mb-1">WhatsApp</p>
                    <p class="text-lg font-semibold text-charcoal mb-2" x-text="advertisement.whatsapp"></p>
                    <a :href="'https://wa.me/' + advertisement.whatsapp.replace(/[^0-9]/g, '')" target="_blank" class="inline-block bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition text-sm">
                        💬 WhatsApp
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Lightbox Modal -->
        <div x-show="lightboxOpen" x-transition.opacity.duration.300ms 
             class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-90"
             @click.self="closeLightbox()" @keydown.escape.window="closeLightbox()">
            
            <!-- Close button -->
            <button @click="closeLightbox()" class="absolute top-4 right-4 text-white text-4xl hover:text-gray-300 transition z-10">
                &times;
            </button>
            
            <!-- Previous button -->
            <button @click.stop="prevPhoto()" class="absolute left-4 text-white text-5xl hover:text-gray-300 transition z-10">
                &#10094;
            </button>
            
            <!-- Image -->
            <div class="max-w-5xl max-h-screen p-4">
                <template x-if="advertisement.photos && advertisement.photos.length > 0">
                    <img :src="advertisement.photos[currentPhotoIndex]" 
                         :alt="'Photo ' + (currentPhotoIndex + 1)" 
                         class="max-w-full max-h-screen object-contain rounded-lg">
                </template>
            </div>
            
            <!-- Next button -->
            <button @click.stop="nextPhoto()" class="absolute right-4 text-white text-5xl hover:text-gray-300 transition z-10">
                &#10095;
            </button>
            
            <!-- Photo counter -->
            <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 text-white text-lg bg-black bg-opacity-50 px-4 py-2 rounded-full">
                <span x-text="(currentPhotoIndex + 1) + ' / ' + (advertisement.photos ? advertisement.photos.length : 0)"></span>
            </div>
        </div>
        
        <div x-show="!loading && !advertisement" class="text-center py-8 text-gray-500">
            Publicité non trouvée
        </div>
    </div>
</div>
{% endblock %}
