{% extends 'layouts/base.html' %}

{% block title %}Créer une Publicité - RencontreCm{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-4">
    <h1 class="text-4xl font-bold text-rose mb-8">Créer une Publicité</h1>
    
    <div class="bg-white rounded-lg shadow-lg p-6" x-data="{ 
        packs: [],
        selectedPack: null,
        form: {
            titre: '',
            description: '',
            photos: [],
            photo_principale: 0,
            numero_contact: '',
            whatsapp: '',
            duree_jours: 7
        },
        loading: true,
        saving: false,
        uploading: false,
        cameraInput: null,
        galleryInput: null,
        init() {
            this.loadPacks();
        },
        loadPacks() {
            fetch('/api/v1/ads/packs')
                .then(r => r.json())
                .then(data => {
                    this.packs = data.packs;
                    this.loading = false;
                })
                .catch(err => {
                    console.error('Error loading packs:', err);
                    this.loading = false;
                });
        },
        selectPack(pack) {
            this.selectedPack = pack;
            this.form.duree_jours = pack.duree_jours;
        },
        handleImageUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            
            // Check photo limit if pack is selected
            if (this.selectedPack) {
                const maxPhotos = this.selectedPack.nombre_photos_max || 1;
                if (this.form.photos.length + files.length > maxPhotos) {
                    alert(`Nombre maximum de photos dépassé. Maximum autorisé: ${maxPhotos}`);
                    return;
                }
            }
            
            this.uploading = true;
            const formData = new FormData();
            
            // Add all files
            for (let i = 0; i < files.length; i++) {
                formData.append('images', files[i]);
            }
            
            fetch('/api/v1/ads/pub/images', {
                method: 'POST',
                body: formData
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    this.form.photos = [...this.form.photos, ...data.image_urls];
                }
                this.uploading = false;
                event.target.value = '';
            })
            .catch(err => {
                console.error('Error uploading images:', err);
                alert('Erreur lors du téléchargement des images');
                this.uploading = false;
            });
        },
        removePhoto(index) {
            this.form.photos.splice(index, 1);
            if (this.form.photo_principale >= this.form.photos.length) {
                this.form.photo_principale = Math.max(0, this.form.photos.length - 1);
            }
        },
        setMainPhoto(index) {
            this.form.photo_principale = index;
        },
        saveDraft() {
            if (!this.form.titre || !this.form.description) {
                alert('Veuillez remplir le titre et la description');
                return;
            }
            
            this.saving = true;
            
            fetch('/api/v1/ads/pub', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    titre: this.form.titre,
                    description: this.form.description,
                    photos: this.form.photos,
                    photo_principale: this.form.photo_principale,
                    numero_contact: this.form.numero_contact,
                    whatsapp: this.form.whatsapp,
                    duree_jours: this.form.duree_jours,
                    pack_id: this.selectedPack ? this.selectedPack.id : null
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    alert('Brouillon enregistré avec succès');
                    window.location.href = '/mes-pubs';
                }
                this.saving = false;
            })
            .catch(err => {
                console.error('Error saving draft:', err);
                alert('Erreur lors de l\'enregistrement');
                this.saving = false;
            });
        },
        submitAd() {
            if (!this.form.titre || !this.form.description) {
                alert('Veuillez remplir le titre et la description');
                return;
            }
            
            if (!this.selectedPack) {
                alert('Veuillez sélectionner un pack');
                return;
            }
            
            if (this.form.photos.length === 0) {
                alert('Veuillez ajouter au moins une photo');
                return;
            }
            
            this.saving = true;
            
            // First create the ad
            fetch('/api/v1/ads/pub', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    titre: this.form.titre,
                    description: this.form.description,
                    photos: this.form.photos,
                    photo_principale: this.form.photo_principale,
                    numero_contact: this.form.numero_contact,
                    whatsapp: this.form.whatsapp,
                    duree_jours: this.form.duree_jours,
                    pack_id: this.selectedPack.id
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    this.saving = false;
                } else {
                    // Then submit it
                    fetch(`/api/v1/ads/pub/${data.advertisement.id}/soumettre`, {
                        method: 'POST'
                    })
                    .then(r => r.json())
                    .then(data => {
                        if (data.error) {
                            alert(data.error);
                        } else {
                            alert('Publicité soumise pour validation. Effectuez le paiement pour l\'activer.');
                            window.location.href = '/mes-pubs';
                        }
                        this.saving = false;
                    })
                    .catch(err => {
                        console.error('Error submitting ad:', err);
                        alert('Erreur lors de la soumission');
                        this.saving = false;
                    });
                }
            })
            .catch(err => {
                console.error('Error creating ad:', err);
                alert('Erreur lors de la création');
                this.saving = false;
            });
        }
    }" x-init="init()">
        <div x-show="loading" class="text-center py-8 text-gray-500">
            Chargement des packs...
        </div>
        
        <div x-show="!loading">
            <!-- Pack Selection -->
            <div class="mb-6">
                <h2 class="text-xl font-bold text-charcoal mb-4">Sélectionnez un pack publicitaire</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <template x-for="pack in packs" :key="pack.id">
                        <div @click="selectPack(pack)" 
                             :class="selectedPack && selectedPack.id === pack.id ? 'border-rose bg-rose-50' : 'border-gray-300'"
                             class="border-2 rounded-lg p-4 cursor-pointer hover:border-rose transition">
                            <h3 class="text-lg font-bold text-charcoal mb-2" x-text="pack.nom"></h3>
                            <p class="text-gray-600 mb-2" x-text="pack.description"></p>
                            <p class="text-2xl font-bold text-rose" x-text="pack.prix + ' FCFA'"></p>
                            <p class="text-sm text-gray-500" x-text="pack.duree_jours + ' jours'"></p>
                            <p class="text-xs text-gray-400 mt-1" x-text="'Max ' + (pack.nombre_photos_max || 1) + ' photo(s)'"></p>
                        </div>
                    </template>
                </div>
            </div>
            
            <!-- Ad Form -->
            <form @submit.prevent="submitAd()">
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-charcoal mb-2">Titre *</label>
                    <input type="text" x-model="form.titre" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose"
                           placeholder="Titre de votre publicité">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-charcoal mb-2">Description *</label>
                    <textarea x-model="form.description" required rows="4"
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose"
                              placeholder="Décrivez votre produit ou service"></textarea>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-charcoal mb-2">
                        Photos
                        <template x-if="selectedPack">
                            <span class="text-gray-500 font-normal ml-2" x-text="'(' + form.photos.length + '/' + selectedPack.nombre_photos_max + ' - Max)'"></span>
                        </template>
                        <template x-if="!selectedPack">
                            <span class="text-gray-500 font-normal ml-2">(Sélectionnez un pack)</span>
                        </template>
                    </label>
                    
                    <!-- Hidden file inputs -->
                    <input type="file" id="cameraInput" x-ref="cameraInput" accept="image/*" capture="environment" multiple @change="handleImageUpload($event)" class="hidden">
                    <input type="file" id="galleryInput" x-ref="galleryInput" accept="image/*" multiple @change="handleImageUpload($event)" class="hidden">
                    
                    <!-- Selection buttons -->
                    <div class="flex gap-4 mb-3">
                        <button @click="document.getElementById('cameraInput').click()" class="flex-1 bg-blue-500 text-white px-4 py-3 rounded-lg hover:bg-blue-600 transition flex items-center justify-center gap-2">
                            <span class="text-xl">📷</span>
                            <span>Caméra</span>
                        </button>
                        <button @click="document.getElementById('galleryInput').click()" class="flex-1 bg-green-500 text-white px-4 py-3 rounded-lg hover:bg-green-600 transition flex items-center justify-center gap-2">
                            <span class="text-xl">🖼️</span>
                            <span>Galerie</span>
                        </button>
                    </div>
                    <p class="text-xs text-gray-500 mb-2">Vous pouvez sélectionner plusieurs photos en une seule fois</p>
                    <div x-show="uploading" class="mt-2 text-sm text-gray-500">Téléchargement...</div>
                    
                    <!-- Photo Grid -->
                    <div x-show="form.photos.length > 0" class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-4">
                        <template x-for="(photo, index) in form.photos" :key="index">
                            <div class="relative group">
                                <img :src="photo" :alt="'Photo ' + (index + 1)" 
                                     :class="form.photo_principale === index ? 'ring-4 ring-rose' : ''"
                                     class="w-full h-32 object-cover rounded-lg cursor-pointer hover:opacity-80"
                                     @click="setMainPhoto(index)">
                                <div x-show="form.photo_principale === index" class="absolute top-2 left-2 bg-rose text-white text-xs px-2 py-1 rounded">
                                    Principale
                                </div>
                                <button @click="removePhoto(index)" 
                                        class="absolute top-2 right-2 bg-red-500 text-white w-6 h-6 rounded-full opacity-0 group-hover:opacity-100 transition">
                                    ×
                                </button>
                            </div>
                        </template>
                    </div>
                    <template x-if="selectedPack && form.photos.length >= selectedPack.nombre_photos_max">
                        <p class="text-xs text-orange-600 mt-2 font-semibold">Nombre maximum de photos atteint</p>
                    </template>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-semibold text-charcoal mb-2">Numéro de contact</label>
                        <input type="text" x-model="form.numero_contact"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose"
                               placeholder="+237 6XX XXX XXX">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-charcoal mb-2">WhatsApp</label>
                        <input type="text" x-model="form.whatsapp"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose"
                               placeholder="+237 6XX XXX XXX">
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-charcoal mb-2">Durée de la publicité</label>
                    <template x-if="selectedPack">
                        <div class="bg-gray-50 px-4 py-2 rounded-lg">
                            <span class="text-gray-700" x-text="form.duree_jours + ' jours (déterminé par le pack ' + selectedPack.nom + ')'"></span>
                        </div>
                    </template>
                    <template x-if="!selectedPack">
                        <div class="bg-gray-50 px-4 py-2 rounded-lg text-gray-500">
                            Sélectionnez un pack pour voir la durée
                        </div>
                    </template>
                </div>
                
                <div class="flex gap-4">
                    <button type="button" @click="saveDraft()" :disabled="saving"
                            class="bg-gray-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-gray-600 transition disabled:opacity-50">
                        <span x-show="!saving">Enregistrer comme brouillon</span>
                        <span x-show="saving">Enregistrement...</span>
                    </button>
                    <button type="submit" :disabled="saving"
                            class="bg-rose text-white px-6 py-3 rounded-lg font-semibold hover:bg-rose-dark transition disabled:opacity-50">
                        <span x-show="!saving">Soumettre pour validation</span>
                        <span x-show="saving">Soumission...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
