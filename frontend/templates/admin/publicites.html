<div x-data="{ 
    advertisements: [],
    pendingAds: [],
    selectedAd: null,
    showHistory: false,
    history: [],
    loading: true,
    rejectModal: false,
    rejectReason: '',
    filter: 'all',
    init() {
        this.loadAdvertisements();
        this.loadPendingAds();
    },
    loadAdvertisements() {
        this.loading = true;
        fetch('/api/v1/admin/publicites')
            .then(r => r.json())
            .then(data => {
                this.advertisements = data.advertisements;
                this.loading = false;
            })
            .catch(err => {
                console.error('Error loading advertisements:', err);
                this.loading = false;
            });
    },
    loadPendingAds() {
        fetch('/api/v1/admin/publicites/en-attente')
            .then(r => r.json())
            .then(data => {
                this.pendingAds = data.advertisements;
            })
            .catch(err => {
                console.error('Error loading pending ads:', err);
            });
    },
    getFilteredAds() {
        if (this.filter === 'pending') {
            return this.pendingAds;
        }
        return this.advertisements;
    },
    getStatusColor(status) {
        const colors = {
            'brouillon': 'bg-gray-100 text-gray-800',
            'en_attente': 'bg-yellow-100 text-yellow-800',
            'validee': 'bg-green-100 text-green-800',
            'rejetee': 'bg-red-100 text-red-800',
            'expiree': 'bg-purple-100 text-purple-800',
            'suspendue': 'bg-orange-100 text-orange-800'
        };
        return colors[status] || 'bg-gray-100 text-gray-800';
    },
    getStatusLabel(status) {
        const labels = {
            'brouillon': 'Brouillon',
            'en_attente': 'En attente',
            'validee': 'Validée',
            'rejetee': 'Rejetée',
            'expiree': 'Expirée',
            'suspendue': 'Suspendue'
        };
        return labels[status] || status;
    },
    validateAd(ad) {
        if (!confirm('Voulez-vous vraiment valider cette publicité?')) return;
        
        fetch(`/api/v1/admin/publicite/${ad.id}/valider`, {
            method: 'POST'
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
            } else {
                this.loadAdvertisements();
                this.loadPendingAds();
            }
        })
        .catch(err => {
            console.error('Error validating ad:', err);
            alert('Erreur lors de la validation');
        });
    },
    openRejectModal(ad) {
        this.selectedAd = ad;
        this.rejectModal = true;
        this.rejectReason = '';
    },
    rejectAd() {
        if (!this.rejectReason || !this.rejectReason.trim()) {
            alert('Veuillez entrer un motif de rejet');
            return;
        }
        
        fetch(`/api/v1/admin/publicite/${this.selectedAd.id}/rejeter`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ motif: this.rejectReason })
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
            } else {
                this.rejectModal = false;
                this.loadAdvertisements();
                this.loadPendingAds();
            }
        })
        .catch(err => {
            console.error('Error rejecting ad:', err);
            alert('Erreur lors du rejet');
        });
    },
    suspendAd(ad) {
        if (!confirm('Voulez-vous vraiment suspendre cette publicité?')) return;
        
        fetch(`/api/v1/admin/publicite/${ad.id}/suspendre`, {
            method: 'POST'
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
            } else {
                this.loadAdvertisements();
            }
        })
        .catch(err => {
            console.error('Error suspending ad:', err);
            alert('Erreur lors de la suspension');
        });
    },
    reactivateAd(ad) {
        if (!confirm('Voulez-vous vraiment réactiver cette publicité?')) return;
        
        fetch(`/api/v1/admin/publicite/${ad.id}/reactiver`, {
            method: 'POST'
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
            } else {
                this.loadAdvertisements();
            }
        })
        .catch(err => {
            console.error('Error reactivating ad:', err);
            alert('Erreur lors de la réactivation');
        });
    },
    deleteAd(ad) {
        if (!confirm('Voulez-vous vraiment supprimer cette publicité? Cette action est irréversible.')) return;
        
        fetch(`/api/v1/admin/publicite/${ad.id}/supprimer`, {
            method: 'DELETE'
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
            } else {
                this.loadAdvertisements();
                this.loadPendingAds();
            }
        })
        .catch(err => {
            console.error('Error deleting ad:', err);
            alert('Erreur lors de la suppression');
        });
    },
    showAdHistory(ad) {
        this.selectedAd = ad;
        this.showHistory = true;
        
        fetch(`/api/v1/admin/publicite/${ad.id}/historique`)
            .then(r => r.json())
            .then(data => {
                this.history = data.history;
            })
            .catch(err => {
                console.error('Error loading history:', err);
            });
    },
    closeHistory() {
        this.showHistory = false;
        this.history = [];
    }
}">
    <h1 class="text-4xl font-bold text-rose mb-8">Gestion des Publicités</h1>
    
    <!-- Filter Tabs -->
    <div class="bg-white rounded-lg shadow-lg p-4 mb-6">
        <div class="flex gap-4">
            <button @click="filter = 'all'" :class="filter === 'all' ? 'bg-rose text-white' : 'bg-gray-200 text-charcoal hover:bg-gray-300'" class="px-4 py-2 rounded-lg transition">
                Toutes
            </button>
            <button @click="filter = 'pending'" :class="filter === 'pending' ? 'bg-rose text-white' : 'bg-gray-200 text-charcoal hover:bg-gray-300'" class="px-4 py-2 rounded-lg transition">
                En attente <span x-show="pendingAds.length > 0" class="ml-1 bg-yellow-500 text-white px-2 py-0.5 rounded-full text-xs" x-text="pendingAds.length"></span>
            </button>
        </div>
    </div>
    
    <!-- Pending Ads Alert -->
    <div x-show="pendingAds.length > 0" class="bg-yellow-100 border-l-4 border-yellow-500 p-4 mb-6">
        <div class="flex">
            <div class="flex-shrink-0">
                <svg class="h-5 w-5 text-yellow-500" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                </svg>
            </div>
            <div class="ml-3">
                <p class="text-sm text-yellow-700">
                    <span x-text="pendingAds.length"></span> publicité(s) en attente de validation
                </p>
            </div>
        </div>
    </div>
    
    <!-- Advertisements List -->
    <div x-show="loading" class="text-center py-8 text-gray-500">
        Chargement...
    </div>
    
    <div x-show="!loading" class="space-y-4">
        <template x-for="ad in getFilteredAds()" :key="ad.id">
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-start gap-4">
                    <div x-show="ad.image_url" class="w-32 h-32 flex-shrink-0">
                        <img :src="ad.image_url" :alt="ad.titre" class="w-full h-full object-cover rounded-lg">
                    </div>
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-2">
                            <h3 class="text-xl font-bold text-charcoal" x-text="ad.titre"></h3>
                            <span :class="getStatusColor(ad.statut)" class="px-3 py-1 rounded-full text-sm font-semibold" x-text="getStatusLabel(ad.statut)"></span>
                        </div>
                        <p class="text-gray-600 mb-2" x-text="ad.description"></p>
                        <div class="grid grid-cols-2 gap-4 text-sm text-gray-500 mb-2">
                            <div>
                                <span class="font-semibold">Annonceur:</span>
                                <span x-text="ad.annonceur_nom"></span>
                            </div>
                            <div>
                                <span class="font-semibold">Email:</span>
                                <span x-text="ad.annonceur_email"></span>
                            </div>
                            <div>
                                <span class="font-semibold">Téléphone:</span>
                                <span x-text="ad.annonceur_telephone"></span>
                            </div>
                            <div>
                                <span class="font-semibold">Pack:</span>
                                <span x-text="ad.pack_nom"></span> - <span x-text="ad.pack_prix + ' FCFA'"></span>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 text-sm text-gray-500 mb-2">
                            <span x-show="ad.numero_contact">📞 <span x-text="ad.numero_contact"></span></span>
                            <span x-show="ad.whatsapp">💬 <span x-text="ad.whatsapp"></span></span>
                        </div>
                        <div class="flex items-center gap-4 text-sm text-gray-500">
                            <span>Créée le: <span x-text="new Date(ad.date_creation).toLocaleDateString('fr-FR')"></span></span>
                            <span x-show="ad.date_debut_validite">Début: <span x-text="new Date(ad.date_debut_validite).toLocaleDateString('fr-FR')"></span></span>
                            <span x-show="ad.date_fin_validite">Fin: <span x-text="new Date(ad.date_fin_validite).toLocaleDateString('fr-FR')"></span></span>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <button @click="showAdHistory(ad)" class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600 transition">Historique</button>
                        <template x-if="ad.statut === 'en_attente'">
                            <div class="flex gap-2">
                                <button @click="validateAd(ad)" class="bg-green-500 text-white px-3 py-1 rounded text-sm hover:bg-green-600 transition">Valider</button>
                                <button @click="openRejectModal(ad)" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600 transition">Rejeter</button>
                            </div>
                        </template>
                        <template x-if="ad.statut === 'validee'">
                            <button @click="suspendAd(ad)" class="bg-orange-500 text-white px-3 py-1 rounded text-sm hover:bg-orange-600 transition">Suspendre</button>
                        </template>
                        <template x-if="ad.statut === 'suspendue'">
                            <div class="flex gap-2">
                                <button @click="reactivateAd(ad)" class="bg-green-500 text-white px-3 py-1 rounded text-sm hover:bg-green-600 transition">Réactiver</button>
                                <button @click="deleteAd(ad)" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600 transition">Supprimer</button>
                            </div>
                        </template>
                        <template x-if="ad.statut === 'rejetee'">
                            <button @click="deleteAd(ad)" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600 transition">Supprimer</button>
                        </template>
                    </div>
                </div>
            </div>
        </template>
    </div>
    
    <!-- Reject Modal -->
    <div x-show="rejectModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" x-cloak>
        <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
            <h3 class="text-xl font-bold text-charcoal mb-4">Rejeter la publicité</h3>
            <textarea x-model="rejectReason" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose mb-4" placeholder="Motif du rejet..."></textarea>
            <div class="flex gap-4">
                <button @click="rejectModal = false" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition">Annuler</button>
                <button @click="rejectAd()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">Rejeter</button>
            </div>
        </div>
    </div>
    
    <!-- History Modal -->
    <div x-show="showHistory" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" x-cloak>
        <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 max-h-[80vh] overflow-y-auto">
            <h3 class="text-xl font-bold text-charcoal mb-4">Historique de validation</h3>
            <div x-show="history.length === 0" class="text-gray-500 mb-4">Aucun historique disponible</div>
            <div class="space-y-3 mb-4">
                <template x-for="h in history" :key="h.id">
                    <div class="bg-gray-50 p-3 rounded-lg">
                        <div class="flex items-center gap-2 mb-1">
                            <span :class="h.action === 'validee' ? 'bg-green-100 text-green-800' : h.action === 'rejetee' ? 'bg-red-100 text-red-800' : 'bg-orange-100 text-orange-800'" class="px-2 py-0.5 rounded-full text-xs font-semibold" x-text="h.action"></span>
                            <span class="text-sm text-gray-500" x-text="new Date(h.created_at).toLocaleString('fr-FR')"></span>
                        </div>
                        <p class="text-sm text-gray-600">Par: <span x-text="h.admin_nom"></span></p>
                        <p x-show="h.motif_rejet" class="text-sm text-gray-600 mt-1">Motif: <span x-text="h.motif_rejet"></span></p>
                    </div>
                </template>
            </div>
            <button @click="closeHistory()" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition w-full">Fermer</button>
        </div>
    </div>
</div>
