{% block title %}Gestion des Packs d'Abonnement - RencontresCM{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 overflow-y-auto max-h-screen" x-data="subscriptionPacks()" x-init="init()">
    <h1 class="text-4xl font-bold text-rose mb-8">Gestion des Packs d'Abonnement</h1>

    <!-- Create Pack Button -->
    <div class="mb-6">
        <button @click="showCreateModal = true" 
            class="bg-rose text-white px-6 py-3 rounded-lg font-semibold hover:bg-rose-dark transition">
            + Créer un Pack
        </button>
    </div>

    <!-- Packs List -->
    <div class="bg-white rounded-lg shadow-lg p-6">
        <div x-show="loading" class="text-center py-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-rose"></div>
            <p class="mt-2 text-gray-600">Chargement...</p>
        </div>

        <div x-show="!loading" class="space-y-4">
            <template x-for="pack in packs" :key="pack.id">
                <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-2">
                                <h3 class="text-xl font-bold text-charcoal" x-text="pack.nom"></h3>
                                <span x-show="pack.badge" 
                                    :class="{
                                        'bg-yellow-500': pack.niveau === 'gold',
                                        'bg-gray-400': pack.niveau === 'silver',
                                        'bg-orange-600': pack.niveau === 'bronze',
                                        'bg-purple-600': pack.niveau === 'vip',
                                        'bg-green-500': pack.niveau === 'gratuit'
                                    }"
                                    class="text-white px-3 py-1 rounded-full text-sm font-semibold"
                                    x-text="pack.badge">
                                </span>
                                <span x-show="!pack.actif" class="bg-red-500 text-white px-3 py-1 rounded-full text-sm">
                                    Inactif
                                </span>
                            </div>
                            <p class="text-gray-600 mb-3" x-text="pack.description"></p>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                                <div>
                                    <span class="font-semibold text-charcoal">Prix:</span>
                                    <span x-text="pack.prix + ' FCFA'"></span>
                                </div>
                                <div>
                                    <span class="font-semibold text-charcoal">Durée:</span>
                                    <span x-text="pack.duree_jours + ' jours'"></span>
                                </div>
                                <div>
                                    <span class="font-semibold text-charcoal">Profils/jour:</span>
                                    <span x-text="pack.profils_consultables_par_jour === -1 ? 'Illimité' : pack.profils_consultables_par_jour"></span>
                                </div>
                                <div>
                                    <span class="font-semibold text-charcoal">WhatsApp/jour:</span>
                                    <span x-text="pack.contacts_whatsapp_par_jour === -1 ? 'Illimité' : pack.contacts_whatsapp_par_jour"></span>
                                </div>
                                <div>
                                    <span class="font-semibold text-charcoal">Appels/jour:</span>
                                    <span x-text="pack.appels_directs_par_jour === -1 ? 'Illimité' : pack.appels_directs_par_jour"></span>
                                </div>
                                <div>
                                    <span class="font-semibold text-charcoal">Mise en avant:</span>
                                    <span x-text="pack.mise_en_avant_pourcentage + '%'"></span>
                                </div>
                            </div>
                        </div>
                        <div class="flex gap-2 ml-4">
                            <button @click="editPack(pack)" 
                                class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
                                Modifier
                            </button>
                            <button @click="deletePack(pack.id)" 
                                class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
                                Supprimer
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div x-show="showCreateModal || showEditModal" 
        class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <h2 class="text-2xl font-bold text-rose mb-6" x-text="showEditModal ? 'Modifier le Pack' : 'Créer un Pack'"></h2>
            
            <form @submit.prevent="savePack()">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
                        <input type="text" x-model="form.nom" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Niveau</label>
                        <select x-model="form.niveau" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                            <option value="gratuit">Gratuit</option>
                            <option value="bronze">Bronze</option>
                            <option value="silver">Silver</option>
                            <option value="gold">Gold</option>
                            <option value="vip">VIP</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Prix (FCFA)</label>
                        <input type="number" x-model="form.prix" min="0" step="100" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Durée (jours)</label>
                        <input type="number" x-model="form.duree_jours" min="1" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Profils consultables par jour (-1 pour illimité)</label>
                        <input type="number" x-model="form.profils_consultables_par_jour" min="-1" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Contacts WhatsApp par jour (-1 pour illimité)</label>
                        <input type="number" x-model="form.contacts_whatsapp_par_jour" min="-1" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Appels directs par jour (-1 pour illimité)</label>
                        <input type="number" x-model="form.appels_directs_par_jour" min="-1" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mise en avant (%)</label>
                        <input type="number" x-model="form.mise_en_avant_pourcentage" min="0" max="100" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Badge</label>
                        <input type="text" x-model="form.badge" placeholder="Ex: Bronze, Silver, Gold, VIP"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <textarea x-model="form.description" rows="3"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose"></textarea>
                    </div>
                    
                    <div class="flex items-center">
                        <input type="checkbox" x-model="form.actif" id="actif" class="mr-2">
                        <label for="actif" class="text-sm font-medium text-gray-700">Actif</label>
                    </div>
                </div>
                
                <div class="flex justify-end gap-4 mt-6">
                    <button type="button" @click="closeModal()" 
                        class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                        Annuler
                    </button>
                    <button type="submit" :disabled="saving"
                        class="bg-rose text-white px-6 py-2 rounded-lg hover:bg-rose-dark transition disabled:opacity-50">
                        <span x-show="!saving">Enregistrer</span>
                        <span x-show="saving">Enregistrement...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function subscriptionPacks() {
    return {
        packs: [],
        loading: false,
        saving: false,
        showCreateModal: false,
        showEditModal: false,
        editingPack: null,
        form: {
            nom: '',
            niveau: 'bronze',
            prix: 5000,
            duree_jours: 30,
            profils_consultables_par_jour: 5,
            contacts_whatsapp_par_jour: 0,
            appels_directs_par_jour: 0,
            mise_en_avant_pourcentage: 0,
            badge: '',
            actif: true,
            description: ''
        },
        init() {
            this.loadPacks();
        },
        loadPacks() {
            this.loading = true;
            fetch('/api/v1/admin/subscription-packs')
                .then(r => r.json())
                .then(data => {
                    this.packs = data.packs;
                    this.loading = false;
                })
                .catch(err => {
                    console.error('Error loading packs:', err);
                    this.loading = false;
                });
        },
        savePack() {
            this.saving = true;
            const url = this.showEditModal 
                ? `/api/v1/admin/subscription-pack/${this.editingPack.id}`
                : '/api/v1/admin/subscription-pack';
            
            const method = this.showEditModal ? 'PUT' : 'POST';
            
            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(this.form)
            })
            .then(r => r.json())
            .then(data => {
                this.saving = false;
                this.closeModal();
                this.loadPacks();
            })
            .catch(err => {
                console.error('Error saving pack:', err);
                this.saving = false;
            });
        },
        editPack(pack) {
            this.editingPack = pack;
            this.form = {
                nom: pack.nom,
                niveau: pack.niveau,
                prix: pack.prix,
                duree_jours: pack.duree_jours,
                profils_consultables_par_jour: pack.profils_consultables_par_jour,
                contacts_whatsapp_par_jour: pack.contacts_whatsapp_par_jour,
                appels_directs_par_jour: pack.appels_directs_par_jour,
                mise_en_avant_pourcentage: pack.mise_en_avant_pourcentage,
                badge: pack.badge,
                actif: pack.actif,
                description: pack.description
            };
            this.showEditModal = true;
        },
        deletePack(packId) {
            if (!confirm('Voulez-vous vraiment supprimer ce pack?')) return;
            
            fetch(`/api/v1/admin/subscription-pack/${packId}`, {
                method: 'DELETE'
            })
            .then(r => r.json())
            .then(data => {
                this.loadPacks();
            })
            .catch(err => {
                console.error('Error deleting pack:', err);
            });
        },
        closeModal() {
            this.showCreateModal = false;
            this.showEditModal = false;
            this.editingPack = null;
            this.form = {
                nom: '',
                niveau: 'bronze',
                prix: 5000,
                duree_jours: 30,
                profils_consultables_par_jour: 5,
                contacts_whatsapp_par_jour: 0,
                appels_directs_par_jour: 0,
                mise_en_avant_pourcentage: 0,
                badge: '',
                actif: true,
                description: ''
            };
        }
    };
}
</script>
{% endblock %}
