<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" x-data="upgradeRequests()" x-init="init()">
    <h1 class="text-4xl font-bold text-rose mb-8">Demandes d'Upgrade d'Abonnement</h1>

    <!-- Filter Tabs -->
    <div class="mb-6 flex flex-wrap gap-2 sm:space-x-4">
        <button @click="filter = 'all'" 
            :class="filter === 'all' ? 'bg-rose text-white' : 'bg-gray-200 text-gray-700'"
            class="px-4 py-2 rounded-lg font-semibold transition">
            Toutes
        </button>
        <button @click="filter = 'en_attente'" 
            :class="filter === 'en_attente' ? 'bg-rose text-white' : 'bg-gray-200 text-gray-700'"
            class="px-4 py-2 rounded-lg font-semibold transition">
            En attente
        </button>
        <button @click="filter = 'approuve'" 
            :class="filter === 'approuve' ? 'bg-rose text-white' : 'bg-gray-200 text-gray-700'"
            class="px-4 py-2 rounded-lg font-semibold transition">
            Approuvées
        </button>
        <button @click="filter = 'refuse'" 
            :class="filter === 'refuse' ? 'bg-rose text-white' : 'bg-gray-200 text-gray-700'"
            class="px-4 py-2 rounded-lg font-semibold transition">
            Refusées
        </button>
    </div>

    <!-- Requests List -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Utilisateur</th>
                        <th class="pack px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pack demandé</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Méthode paiement</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Statut</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <template x-for="request in filteredRequests" :key="request.id">
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm font-medium text-gray-900" x-text="request.user_nom"></div>
                                <div class="text-sm text-gray-500" x-text="request.user_email"></div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm font-medium text-gray-900" x-text="request.pack?.nom"></div>
                                <div class="text-sm text-gray-500" x-text="request.pack?.prix + ' FCFA'"></div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                                    :class="{
                                        'bg-green-100 text-green-800': request.methode_paiement === 'mobile',
                                        'bg-blue-100 text-blue-800': request.methode_paiement === 'carte',
                                        'bg-gray-100 text-gray-800': request.methode_paiement === 'manuel'
                                    }" x-text="request.methode_paiement">
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                                    :class="{
                                        'bg-yellow-100 text-yellow-800': request.statut === 'en_attente',
                                        'bg-green-100 text-green-800': request.statut === 'approuve',
                                        'bg-red-100 text-red-800': request.statut === 'refuse'
                                    }" x-text="request.statut">
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="new Date(request.created_at).toLocaleDateString('fr-FR')"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <template x-if="request.statut === 'en_attente'">
                                    <div class="flex flex-wrap gap-2">
                                        <button @click="approveRequest(request.id)" 
                                            class="text-green-600 hover:text-green-900 font-semibold">
                                            Approuver
                                        </button>
                                        <button @click="showRejectModal = true; selectedRequest = request" 
                                            class="text-red-600 hover:text-red-900 font-semibold">
                                            Refuser
                                        </button>
                                    </div>
                                </template>
                                <template x-if="request.statut !== 'en_attente'">
                                    <span class="text-gray-400" x-text="request.admin_nom ? 'Par ' + request.admin_nom : ''"></span>
                                </template>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="filteredRequests.length === 0">
                        <td colspan="6" class="px-6 py-4 text-center text-gray-500">
                            Aucune demande trouvée
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Reject Modal -->
    <div x-show="showRejectModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
            <h3 class="text-lg font-bold text-gray-900 mb-4">Refuser la demande</h3>
            <p class="text-sm text-gray-600 mb-4">
                Veuillez indiquer la raison du refus:
            </p>
            <textarea x-model="rejectReason" 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose"
                rows="3" placeholder="Raison du refus..."></textarea>
            <div class="mt-4 flex flex-wrap justify-end gap-3">
                <button @click="showRejectModal = false; rejectReason = ''" 
                    class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">
                    Annuler
                </button>
                <button @click="rejectRequest()" 
                    class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition">
                    Refuser
                </button>
            </div>
        </div>
    </div>

    <script>
        function upgradeRequests() {
            console.log('upgradeRequests function defined');
            return {
                requests: [],
                filter: 'all',
                loading: false,
                showRejectModal: false,
                selectedRequest: null,
                rejectReason: '',

                get filteredRequests() {
                    if (this.filter === 'all') return this.requests;
                    return this.requests.filter(r => r.statut === this.filter);
                },

                init() {
                    console.log('upgradeRequests init called');
                    this.loadRequests();
                },

                loadRequests() {
                    console.log('loadRequests called');
                    this.loading = true;
                    fetch('/api/v1/admin/upgrade-requests')
                        .then(r => r.json())
                        .then(data => {
                            console.log('Requests loaded:', data);
                            this.requests = data.requests;
                            this.loading = false;
                        })
                        .catch(err => {
                            console.error('Error loading requests:', err);
                            this.loading = false;
                        });
                },

                approveRequest(requestId) {
                    if (!confirm('Voulez-vous vraiment approuver cette demande?')) return;
                    
                    fetch(`/api/v1/admin/upgrade-request/${requestId}/approve`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    })
                    .then(r => r.json())
                    .then(data => {
                        alert('Demande approuvée avec succès');
                        this.loadRequests();
                    })
                    .catch(err => {
                        console.error('Error approving request:', err);
                        alert('Erreur lors de l\'approbation');
                    });
                },

                rejectRequest() {
                    if (!this.selectedRequest) return;
                    
                    fetch(`/api/v1/admin/upgrade-request/${this.selectedRequest.id}/reject`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ admin_notes: this.rejectReason })
                    })
                    .then(r => r.json())
                    .then(data => {
                        alert('Demande refusée');
                        this.showRejectModal = false;
                        this.rejectReason = '';
                        this.selectedRequest = null;
                        this.loadRequests();
                    })
                    .catch(err => {
                        console.error('Error rejecting request:', err);
                        alert('Erreur lors du refus');
                    });
                }
            };
        }
    </script>
</div>
