{% extends "layouts/admin.html" %}

{% block title %}Gestion des Abonnements Utilisateurs - RencontresCM{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h1 class="text-4xl font-bold text-rose mb-8">Gestion des Abonnements Utilisateurs</h1>

    <!-- Assign Subscription Button -->
    <div class="mb-6">
        <button @click="showAssignModal = true" 
            class="bg-rose text-white px-6 py-3 rounded-lg font-semibold hover:bg-rose-dark transition">
            + Attribuer un Abonnement
        </button>
    </div>

    <!-- Search -->
    <div class="mb-6">
        <input type="text" x-model="search" @keyup.enter="loadSubscriptions()" placeholder="Rechercher par email ou nom..."
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
    </div>

    <!-- Subscriptions List -->
    <div class="bg-white rounded-lg shadow-lg p-6">
        <div x-show="loading" class="text-center py-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-rose"></div>
            <p class="mt-2 text-gray-600">Chargement...</p>
        </div>

        <div x-show="!loading" class="overflow-x-auto max-h-[70vh] overflow-y-auto scrollbar-thin scrollbar-thumb-rose scrollbar-track-gray-200">
            <table class="min-w-full">
                <thead class="bg-gray-50 sticky top-0">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Utilisateur</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pack</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date Début</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date Fin</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Statut</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quotas</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <template x-for="subscription in subscriptions" :key="subscription.id">
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm font-medium text-gray-900" x-text="subscription.utilisateur?.nom || 'N/A'"></div>
                                <div class="text-sm text-gray-500" x-text="subscription.utilisateur?.email || 'N/A'"></div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm font-medium text-gray-900" x-text="subscription.pack?.nom || 'N/A'"></div>
                                <span x-show="subscription.pack?.badge" 
                                    :class="{
                                        'bg-yellow-500': subscription.pack?.niveau === 'gold',
                                        'bg-gray-400': subscription.pack?.niveau === 'silver',
                                        'bg-orange-600': subscription.pack?.niveau === 'bronze',
                                        'bg-purple-600': subscription.pack?.niveau === 'vip',
                                        'bg-green-500': subscription.pack?.niveau === 'gratuit'
                                    }"
                                    class="text-white px-2 py-1 rounded-full text-xs font-semibold"
                                    x-text="subscription.pack?.badge">
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="formatDate(subscription.date_debut)"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="formatDate(subscription.date_fin)"></td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span :class="{
                                    'bg-green-100 text-green-800': subscription.statut === 'actif',
                                    'bg-red-100 text-red-800': subscription.statut === 'expire',
                                    'bg-gray-100 text-gray-800': subscription.statut === 'annule'
                                }"
                                class="px-2 py-1 rounded-full text-xs font-semibold"
                                x-text="subscription.statut">
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                <div>Profils: <span x-text="subscription.pack?.profils_consultables_par_jour === -1 ? '∞' : subscription.profils_consultes_aujourdhui + '/' + subscription.pack?.profils_consultables_par_jour"></span></div>
                                <div>WhatsApp: <span x-text="subscription.pack?.contacts_whatsapp_par_jour === -1 ? '∞' : subscription.contacts_whatsapp_aujourdhui + '/' + subscription.pack?.contacts_whatsapp_par_jour"></span></div>
                                <div>Appels: <span x-text="subscription.pack?.appels_directs_par_jour === -1 ? '∞' : subscription.appels_directs_aujourdhui + '/' + subscription.pack?.appels_directs_par_jour"></span></div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <button @click="editSubscription(subscription)" 
                                    class="text-blue-600 hover:text-blue-900 mr-3">Modifier</button>
                                <button @click="deleteSubscription(subscription.id)" 
                                    class="text-red-600 hover:text-red-900">Supprimer</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Assign Modal -->
    <div x-show="showAssignModal" 
        class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
            <h2 class="text-2xl font-bold text-rose mb-6">Attribuer un Abonnement</h2>
            
            <form @submit.prevent="assignSubscription()">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Utilisateur (Email)</label>
                        <input type="email" x-model="assignForm.user_email" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Pack</label>
                        <select x-model="assignForm.pack_id" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                            <template x-for="pack in packs" :key="pack.id">
                                <option :value="pack.id" x-text="pack.nom + ' - ' + pack.prix + ' FCFA'"></option>
                            </template>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Méthode de paiement</label>
                        <select x-model="assignForm.methode_paiement"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                            <option value="manuel">Manuel</option>
                            <option value="mobile">Mobile Money</option>
                            <option value="carte">Carte bancaire</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Référence de paiement</label>
                        <input type="text" x-model="assignForm.reference_paiement"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                    </div>
                </div>
                
                <div class="flex justify-end gap-4 mt-6">
                    <button type="button" @click="closeAssignModal()" 
                        class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                        Annuler
                    </button>
                    <button type="submit" :disabled="assigning"
                        class="bg-rose text-white px-6 py-2 rounded-lg hover:bg-rose-dark transition disabled:opacity-50">
                        <span x-show="!assigning">Attribuer</span>
                        <span x-show="assigning">Attribution...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Modal -->
    <div x-show="showEditModal" 
        class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
            <h2 class="text-2xl font-bold text-rose mb-6">Modifier l'Abonnement</h2>
            
            <form @submit.prevent="updateSubscription()">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Statut</label>
                        <select x-model="editForm.statut"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                            <option value="actif">Actif</option>
                            <option value="expire">Expiré</option>
                            <option value="annule">Annulé</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Pack</label>
                        <select x-model="editForm.pack_id"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                            <template x-for="pack in packs" :key="pack.id">
                                <option :value="pack.id" x-text="pack.nom"></option>
                            </template>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date de fin</label>
                        <input type="datetime-local" x-model="editForm.date_fin"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-rose">
                    </div>
                </div>
                
                <div class="flex justify-end gap-4 mt-6">
                    <button type="button" @click="closeEditModal()" 
                        class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                        Annuler
                    </button>
                    <button type="submit" :disabled="updating"
                        class="bg-rose text-white px-6 py-2 rounded-lg hover:bg-rose-dark transition disabled:opacity-50">
                        <span x-show="!updating">Enregistrer</span>
                        <span x-show="updating">Enregistrement...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function userSubscriptions() {
    return {
        subscriptions: [],
        packs: [],
        loading: false,
        assigning: false,
        updating: false,
        search: '',
        showAssignModal: false,
        showEditModal: false,
        editingSubscription: null,
        assignForm: {
            user_email: '',
            pack_id: '',
            methode_paiement: 'manuel',
            reference_paiement: ''
        },
        editForm: {
            statut: 'actif',
            pack_id: '',
            date_fin: ''
        },
        init() {
            this.loadSubscriptions();
            this.loadPacks();
        },
        loadSubscriptions() {
            this.loading = true;
            let url = '/api/v1/admin/user-subscriptions';
            if (this.search) {
                url += '?search=' + this.search;
            }
            fetch(url)
                .then(r => r.json())
                .then(data => {
                    this.subscriptions = data.subscriptions;
                    this.loading = false;
                })
                .catch(err => {
                    console.error('Error loading subscriptions:', err);
                    this.loading = false;
                });
        },
        loadPacks() {
            fetch('/api/v1/admin/subscription-packs')
                .then(r => r.json())
                .then(data => {
                    this.packs = data.packs;
                })
                .catch(err => {
                    console.error('Error loading packs:', err);
                });
        },
        assignSubscription() {
            this.assigning = true;
            
            // First get user ID from email
            fetch(`/api/v1/admin/utilisateurs?search=${this.assignForm.user_email}`)
                .then(r => r.json())
                .then(data => {
                    if (data.utilisateurs.length === 0) {
                        alert('Utilisateur non trouvé');
                        this.assigning = false;
                        return;
                    }
                    
                    const user = data.utilisateurs[0];
                    
                    fetch('/api/v1/admin/user-subscription', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: user.id,
                            pack_id: this.assignForm.pack_id,
                            methode_paiement: this.assignForm.methode_paiement,
                            reference_paiement: this.assignForm.reference_paiement
                        })
                    })
                    .then(r => r.json())
                    .then(data => {
                        this.assigning = false;
                        this.closeAssignModal();
                        this.loadSubscriptions();
                    })
                    .catch(err => {
                        console.error('Error assigning subscription:', err);
                        this.assigning = false;
                    });
                })
                .catch(err => {
                    console.error('Error finding user:', err);
                    this.assigning = false;
                });
        },
        editSubscription(subscription) {
            this.editingSubscription = subscription;
            this.editForm = {
                statut: subscription.statut,
                pack_id: subscription.pack_id,
                date_fin: subscription.date_fin.slice(0, 16)
            };
            this.showEditModal = true;
        },
        updateSubscription() {
            this.updating = true;
            fetch(`/api/v1/admin/user-subscription/${this.editingSubscription.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(this.editForm)
            })
            .then(r => r.json())
            .then(data => {
                this.updating = false;
                this.closeEditModal();
                this.loadSubscriptions();
            })
            .catch(err => {
                console.error('Error updating subscription:', err);
                this.updating = false;
            });
        },
        deleteSubscription(subscriptionId) {
            if (!confirm('Voulez-vous vraiment supprimer cet abonnement?')) return;
            
            fetch(`/api/v1/admin/user-subscription/${subscriptionId}`, {
                method: 'DELETE'
            })
            .then(r => r.json())
            .then(data => {
                this.loadSubscriptions();
            })
            .catch(err => {
                console.error('Error deleting subscription:', err);
            });
        },
        closeAssignModal() {
            this.showAssignModal = false;
            this.assignForm = {
                user_email: '',
                pack_id: '',
                methode_paiement: 'manuel',
                reference_paiement: ''
            };
        },
        closeEditModal() {
            this.showEditModal = false;
            this.editingSubscription = null;
            this.editForm = {
                statut: 'actif',
                pack_id: '',
                date_fin: ''
            };
        },
        formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('fr-FR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
    };
}
</script>
